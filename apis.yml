name: Nebulock
description: >-
  Nebulock is an agentic, contextual security-analytics platform built for hunt-first security
  operations. A swarm of AI agents continuously hunts across cloud, SaaS, network, endpoint, and
  identity telemetry, maintaining a behavioral Context Graph to surface endpoint- and identity-based
  threats, close detection coverage gaps, and catch human and agentic insider threats before they
  escalate into incidents. The platform runs hypothesis-driven investigations, writes and deploys
  detection rules (Sigma and scheduled SQL), retrohunts historical data, simulates attacks, and maps
  coverage against MITRE ATT&CK. Nebulock exposes a customer-facing public API for Findings, Entities
  (actors/users/hosts correlation), Hunts, hunt suggestions and reports, and detection Rules,
  authenticated with per-organization API keys. The company raised a $25M Series A and is backed by
  Bain Capital Ventures.
